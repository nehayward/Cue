#:schema node_modules/wrangler/config-schema.json
name = "cue-site"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# The Worker is cue.dance's custom domain: Cloudflare creates the DNS record
# and certificate on deploy. api.cue.dance and resource.cue.dance are
# separate and untouched.
routes = [{ pattern = "cue.dance", custom_domain = true }]

# public/ is served straight from Cloudflare's edge (styles, icons);
# any path without a file there runs the Worker.
[assets]
directory = "./public"

