#:schema node_modules/wrangler/config-schema.json
name = "cue-site"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# cue.dance is on Cloudflare; the Worker serves every path on the apex.
# api.cue.dance and resource.cue.dance are separate and untouched.
routes = [{ pattern = "cue.dance/*", zone_name = "cue.dance" }]

# public/ is served straight from Cloudflare's edge (styles, icons);
# any path without a file there runs the Worker.
[assets]
directory = "./public"

